[project]
name = "portal-pfk-nuk"
version = "1.3"
description = "Утиліта для легкого доступу до студентських сервісів"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "xdenotte" }]
dependencies = [
    "flet==1.0.5",
    "beautifulsoup4",
    "httpx>=0.27",
]

[tool.flet]
org = "the.goddess"
product = "PortalPFK"
company = "TheGoddess"

[tool.flet.app]
path = "src"

[tool.flet.android]
split_per_abi = true

[tool.flet.android.permission]
"android.permission.INTERNET" = true
